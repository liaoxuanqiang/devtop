name: DevTop

# "on" 键加引号，避免 YAML 解析歧义
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

# 最小权限：本工作流不需要读写仓库内容
permissions: {}

# 并发保护：同一时刻只运行一个实例，防止定时与手动触发重叠
concurrency:
  group: devtop-rdp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    # 与 cron（每 6 小时）对齐，保证单次运行覆盖整个调度周期
    timeout-minutes: 360

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Configure Core RDP Settings
        run: |
          Write-Host "::group::Disable Windows Firewall"
          # 直接禁用 Windows 防火墙（全部配置文件），访问控制交给 Tailscale ACL
          netsh advfirewall set allprofiles state off
          if ($LASTEXITCODE -ne 0) { Write-Warning "netsh advfirewall 返回 $LASTEXITCODE" }
          Write-Host "::endgroup::"

          Write-Host "::group::Enable RDP"
          # 启用远程桌面；关闭网络级身份认证与安全层，方便任意 RDP 客户端接入
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force
          # 重启远程桌面服务使配置生效（首次启动报错可忽略）
          Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
          Write-Host "::endgroup::"
      - name: Create RDP User with Secure Password
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          # 将密码加入日志遮盖列表（GitHub 对 secret 自动遮盖，此为双保险）
          if ($env:RDP_PASSWORD) { Write-Output "::add-mask::$env:RDP_PASSWORD" }

          if ([string]::IsNullOrEmpty($env:RDP_USERNAME)) {
              Write-Error "RDP_USERNAME is not configured in GitHub Secrets. Please add it."
              exit 1
          }
          if ([string]::IsNullOrEmpty($env:RDP_PASSWORD)) {
              Write-Error "RDP_PASSWORD is not configured in GitHub Secrets. Please add it."
              exit 1
          }
          Write-Host "RDP_USERNAME is configured."

          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $existing = Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue

          if ($existing) {
              # 幂等处理：runner 复用场景下重置密码即可，避免重复创建报错
              Set-LocalUser -Name $env:RDP_USERNAME -Password $securePass -AccountNeverExpires
              Write-Host "'$env:RDP_USERNAME' 已存在，已重置密码。"
          } else {
              try {
                  New-LocalUser -Name $env:RDP_USERNAME -Password $securePass -AccountNeverExpires
                  Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USERNAME
                  Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USERNAME
                  Write-Host "'$env:RDP_USERNAME' 创建成功并加入管理员/远程桌面组。"
              } catch {
                  Write-Error "RDP 用户创建失败: $($_.Exception.Message)"
                  exit 1
              }
          }

          if (-not (Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue)) {
              Write-Error "RDP 用户存在性校验失败"
              exit 1
          }
      - name: Uninstall Unnecessary Software
        run: |
          Write-Host "::group::Uninstall unnecessary software"
          $regPaths = @(
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $targets = @('*Google Chrome*', '*Mozilla Firefox*', '*Unity Hub*', 'R for Windows*', 'Rtools*')
          Get-ItemProperty $regPaths -ErrorAction SilentlyContinue |
              Where-Object { $name = $_.DisplayName; $matched = $false; foreach ($p in $targets) { if ($name -like $p) { $matched = $true } } $matched } |
              ForEach-Object {
                  $pkg = $_
                  Write-Host "  Uninstalling: $($pkg.DisplayName)"
                  try {
                      if ($pkg.PSChildName -match '^\{') {
                          # MSI 产品：通过 GUID 静默卸载
                          $p = Start-Process msiexec.exe -ArgumentList "/x $($pkg.PSChildName) /quiet /norestart" -NoNewWindow -Wait -PassThru -ErrorAction Stop
                          if ($p.ExitCode -notin 0, 1605, 3010) {
                              Write-Warning "    msiexec 退出码 $($p.ExitCode)，卸载可能未完成"
                          }
                      } elseif ($pkg.UninstallString) {
                          $exe = ($pkg.UninstallString -split '"')[1]
                          if (-not $exe) { $exe = ($pkg.UninstallString -split ' ')[0] }
                          if ($exe) {
                              # 尝试常见静默卸载参数（尽力而为）
                              Start-Process -FilePath $exe -ArgumentList '/S /SILENT /SUPPRESSMSGBOXES /VERYSILENT --uninstall --force-uninstall' -NoNewWindow -Wait -ErrorAction Stop
                          }
                      }
                  } catch {
                      # 单条软件卸载失败不阻断整个工作流
                      Write-Warning "    卸载 '$($pkg.DisplayName)' 失败（非致命）: $($_.Exception.Message)"
                  }
              }
          Write-Host "::endgroup::Cleanup completed (best-effort)"
      - name: Install Tailscale
        run: |
          Write-Host "::group::Install Tailscale via winget"
          $tsDir = [Environment]::GetFolderPath('ProgramFiles') + '\Tailscale'
          $tsBin = Join-Path $tsDir 'tailscale.exe'

          if (-not (Test-Path $tsBin)) {
              # 幂等安装：已存在则跳过，避免 winget 重复操作
              winget install --id Tailscale.Tailscale --source winget `
                  --accept-package-agreements --accept-source-agreements `
                  --silent --disable-interactivity
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "winget install Tailscale failed (exit $LASTEXITCODE)"
                  exit 1
              }
          } else {
              Write-Host "  Tailscale already installed."
          }

          # 持久化 PATH 与二进制路径，供后续步骤使用
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -notlike "*$tsDir*") {
              [Environment]::SetEnvironmentVariable('Path', "$machinePath;$tsDir", 'Machine') | Out-Null
          }
          Write-Output $tsDir | Add-Content -Path $env:GITHUB_PATH
          Add-Content -Path $env:GITHUB_ENV -Value "TS_BIN=$tsBin"

          Set-Service -Name Tailscale -StartupType Automatic -ErrorAction SilentlyContinue
          Write-Host "::endgroup::Tailscale ready at $tsBin"

      - name: Authenticate Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:TAILSCALE_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY is not configured in GitHub Secrets."
              exit 1
          }
          $tsBin = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          Write-Host "Authenticating Tailscale (hostname=devtop)..."
          # 认证密钥由 GitHub 自动遮盖，不会出现在日志
          & $tsBin up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=devtop
          if ($LASTEXITCODE -ne 0) {
              Write-Error "tailscale up failed (exit $LASTEXITCODE)"
              exit 1
          }

          # 等待 Tailscale 分配 IPv4（最长约 150 秒，原实现仅 50 秒）
          $tsIP = $null
          for ($i = 0; $i -lt 30 -and -not $tsIP; $i++) {
              $line = & $tsBin ip -4 2>$null | Select-Object -First 1
              if ($line) { $tsIP = ($line -split '\s+')[0] }
              if (-not $tsIP) { Start-Sleep -Seconds 5 }
          }
          if (-not $tsIP) {
              Write-Error "Tailscale 未能分配 IP："
              & $tsBin status
              exit 1
          }

          # 暴露给后续步骤
          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIP"
          Write-Host "Tailscale IP: $tsIP"

      - name: Configure Tailscale (API Cleanup)
        env:
          TAILSCALE_API_TOKEN: ${{ secrets.TAILSCALE_API_TOKEN }}
        run: |
          $tsBin = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          # API 清理依赖 Token；未配置则跳过此步骤
          if (-not $env:TAILSCALE_API_TOKEN) {
              Write-Host "TAILSCALE_API_TOKEN 未配置，跳过 API 清理。"
              exit 0
          }

          Write-Host "::group::Tailscale API operations"
          $apiBase = "https://api.tailscale.com/api/v2"
          $headers = @{ "Authorization" = "Bearer $env:TAILSCALE_API_TOKEN" }

          # 获取当前设备 ID
          $statusJson = & $tsBin status --json 2>$null | ConvertFrom-Json
          $deviceId = $statusJson.Self.ID

          if ($deviceId) {
              try {
                  # 清理旧的 devtop 设备（保留当前仍在运行的这台）
                  $allDevices = Invoke-RestMethod -Uri "$apiBase/tailnet/-/devices" -Method Get -Headers $headers
                  $currentApi = $allDevices.devices | Where-Object { $_.nodeId -eq $deviceId }
                  if ($currentApi) { $deviceId = $currentApi.id }

                  $allDevices.devices | Where-Object { $_.hostname -eq "devtop" -and $_.id -ne $deviceId } | ForEach-Object {
                      Write-Host "  Cleaning old device: $($_.name) (ID: $($_.id))"
                      try { Invoke-RestMethod -Uri "$apiBase/device/$($_.id)/authorized" -Method Post -Headers $headers -Body (@{ "authorized" = $false } | ConvertTo-Json) -ContentType "application/json" -ErrorAction Stop } catch {}
                      try { Invoke-RestMethod -Uri "$apiBase/device/$($_.id)" -Method Delete -Headers $headers -ErrorAction Stop } catch {}
                  }
                  # 将设备名固定为 devtop
                  Invoke-RestMethod -Uri "$apiBase/device/$deviceId/name" -Method Post -Headers $headers -Body (@{ "name" = "devtop" } | ConvertTo-Json) -ContentType "application/json" -ErrorAction Stop
                  Write-Host "  Machine name set to 'devtop'."
              } catch { Write-Warning "  API 清理/改名失败（非致命）: $_" }

          }

          # 重新读取最终 IP（设备名/设置可能引起变更）
          $actualIP = & $tsBin ip -4 2>$null | Select-Object -First 1
          if ($actualIP) { Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$actualIP" }
          Write-Host "::endgroup::Tailscale API operations done"

      - name: Configure Subnet Routes and Exit Node
        run: |
          $tsBin = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          Write-Host "::group::Advertise routes / exit node"
          $localIPs = Get-NetIPAddress -AddressFamily IPv4 | Where-Object {
              $_.IPAddress -ne '127.0.0.1' -and
              $_.PrefixOrigin -ne 'WellKnown' -and
              $_.InterfaceAlias -ne 'Tailscale'
          }

          $subnets = @()
          foreach ($ip in $localIPs) {
              # IP + Prefix 长度 → 子网（IPv4 位运算）
              $ipBytes = [System.Net.IPAddress]::Parse($ip.IPAddress).GetAddressBytes()
              [Array]::Reverse($ipBytes)
              $ipInt = [System.BitConverter]::ToUInt32($ipBytes, 0)
              $maskInt = [uint32]::MaxValue -shl (32 - $ip.PrefixLength)
              $netInt = $ipInt -band $maskInt
              $netBytes = [System.BitConverter]::GetBytes($netInt)
              [Array]::Reverse($netBytes)
              $subnets += "$([System.Net.IPAddress]::new($netBytes).IPAddressToString)/$($ip.PrefixLength)"
          }

          if ($subnets) {
              & $tsBin set --advertise-routes="$($subnets -join ',')" `
                         --advertise-exit-node --accept-routes --accept-dns=false
              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "tailscale set 返回 $LASTEXITCODE（可能需要控制台审批路由/Exit Node）"
              }
          } else {
              Write-Warning "未找到可广播的子网，跳过 advertise-routes"
          }
          Write-Host "::endgroup::"

          Write-Host "Tailscale 配置完成！IP: $env:TAILSCALE_IP"
          Write-Host "=== Tailscale 配置完成 ==="
      - name: Maintain Connection
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ($env:RDP_PASSWORD) { Write-Output "::add-mask::$env:RDP_PASSWORD" }
          Write-Host "`n=== RDP 服务已就绪 ==="
          Write-Host "RDP Address (Tailscale IP): $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: （出于安全考虑，不在日志中显示）"
          Write-Host "===================================`n"

          # 保持 runner 存活，直到任务超时或手动取消
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancel the workflow to stop"
              Start-Sleep -Seconds 300
          }
