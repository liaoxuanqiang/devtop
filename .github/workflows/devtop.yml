name: DevTop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions: {}

concurrency:
  group: devtop-rdp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Configure RDP and Firewall
        run: |
          Write-Host "::group::Enable RDP with NLA"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 1 -Force
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True -ErrorAction Stop

          Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue |
              Disable-NetFirewallRule -ErrorAction Stop
          New-NetFirewallRule -DisplayName 'RDP over Tailscale only' `
              -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 `
              -LocalAddress '100.64.0.0/10' -RemoteAddress '100.64.0.0/10' `
              -Profile Any -ErrorAction Stop | Out-Null

          Restart-Service -Name TermService -Force -ErrorAction Stop
          Write-Host "::endgroup::"

      - name: Configure Existing RDP User
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:RDP_PASSWORD)) {
              Write-Error "RDP_PASSWORD is not configured in GitHub Secrets. Please add it."
              exit 1
          }

          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          try {
              $rdpUsername = $env:USERNAME
              if ([string]::IsNullOrWhiteSpace($rdpUsername)) {
                  throw "Could not determine the current runner username."
              }

              $existing = Get-LocalUser -Name $rdpUsername -ErrorAction SilentlyContinue
              if (-not $existing) {
                  throw "Local account '$rdpUsername' does not exist; refusing to create it."
              }

              Set-LocalUser -Name $rdpUsername -Password $securePass `
                  -AccountNeverExpires -PasswordNeverExpires $true -ErrorAction Stop
              Write-Host "'$rdpUsername' 已存在，已重置密码。"

              Enable-LocalUser -Name $rdpUsername -ErrorAction Stop
              Add-Content -Path $env:GITHUB_ENV -Value "RDP_USERNAME=$rdpUsername"
          } catch {
              Write-Error "RDP 用户配置失败: $($_.Exception.Message)"
              exit 1
          }
      - name: Uninstall Unnecessary Software
        run: |
          Write-Host "::group::Uninstall unnecessary software"
          $regPaths = @(
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $targets = @('*Google Chrome*', '*Mozilla Firefox*', '*Unity Hub*', 'R for Windows*', 'Rtools*')
          Get-ItemProperty $regPaths -ErrorAction SilentlyContinue |
              Where-Object { $name = $_.DisplayName; $matched = $false; foreach ($p in $targets) { if ($name -like $p) { $matched = $true } } $matched } |
              ForEach-Object {
                  $pkg = $_
                  Write-Host "  Uninstalling: $($pkg.DisplayName)"
                  try {
                      if ($pkg.PSChildName -match '^\{') {
                          $p = Start-Process msiexec.exe -ArgumentList "/x $($pkg.PSChildName) /quiet /norestart" -NoNewWindow -Wait -PassThru -ErrorAction Stop
                          if ($p.ExitCode -notin 0, 1605, 3010) {
                              Write-Warning "    msiexec 退出码 $($p.ExitCode)，卸载可能未完成"
                          }
                      } elseif ($pkg.UninstallString) {
                          $command = if ($pkg.QuietUninstallString) { $pkg.QuietUninstallString } else { $pkg.UninstallString }
                          $command = [Environment]::ExpandEnvironmentVariables($command)
                          if ($command -match '^\s*"(?<exe>[^"]+)"\s*(?<args>.*)$') {
                              $exe = $Matches.exe
                              $arguments = [string]$Matches.args
                          } elseif ($command -match '^\s*(?<exe>.+?\.exe)(?:\s+(?<args>.*))?$') {
                              $exe = $Matches.exe.Trim()
                              $arguments = [string]$Matches.args
                          } else {
                              throw "无法解析卸载命令: $command"
                          }

                          if (-not $pkg.QuietUninstallString) {
                              $arguments = "$arguments /S /SILENT /SUPPRESSMSGBOXES /VERYSILENT --uninstall --force-uninstall".Trim()
                          }
                          $p = Start-Process -FilePath $exe -ArgumentList $arguments -NoNewWindow -Wait -PassThru -ErrorAction Stop
                          if ($p.ExitCode -notin 0, 1605, 3010) {
                              Write-Warning "    卸载进程退出码 $($p.ExitCode)，卸载可能未完成"
                          }
                      }
                  } catch {
                      Write-Warning "    卸载 '$($pkg.DisplayName)' 失败（非致命）: $($_.Exception.Message)"
                  }
              }
          Write-Host "::endgroup::Cleanup completed (best-effort)"
      - name: Install Tailscale
        run: |
          Write-Host "::group::Install Tailscale via winget"
          $tsDir = Join-Path $env:ProgramFiles 'Tailscale'
          $tsBin = Join-Path $tsDir 'tailscale.exe'

          if (-not (Test-Path $tsBin)) {
              winget install --id Tailscale.Tailscale --source winget `
                  --accept-package-agreements --accept-source-agreements `
                  --silent --disable-interactivity
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "winget install Tailscale failed (exit $LASTEXITCODE)"
                  exit 1
              }
          } else {
              Write-Host "  Tailscale already installed."
          }

          if (-not (Test-Path -LiteralPath $tsBin)) {
              Write-Error "Tailscale executable not found: $tsBin"
              exit 1
          }

          Add-Content -Path $env:GITHUB_ENV -Value "TS_BIN=$tsBin"
          Write-Host "::endgroup::Tailscale ready at $tsBin"

      - name: Authenticate Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:TAILSCALE_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY is not configured in GitHub Secrets."
              exit 1
          }
          Write-Host "Authenticating Tailscale (hostname=devtop)..."
          & $env:TS_BIN up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=devtop
          if ($LASTEXITCODE -ne 0) {
              Write-Error "tailscale up failed (exit $LASTEXITCODE)"
              exit 1
          }

          $tsIP = $null
          for ($i = 0; $i -lt 30 -and -not $tsIP; $i++) {
              $tsIP = & $env:TS_BIN ip -4 2>$null | Select-Object -First 1
              if (-not $tsIP) { Start-Sleep -Seconds 5 }
          }
          if (-not $tsIP) {
              Write-Error "Tailscale 未能分配 IP："
              & $env:TS_BIN status
              exit 1
          }

          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIP"
          Write-Host "Tailscale IP: $tsIP"

      - name: Configure Tailscale (API Cleanup)
        env:
          TAILSCALE_API_TOKEN: ${{ secrets.TAILSCALE_API_TOKEN }}
        run: |
          if (-not $env:TAILSCALE_API_TOKEN) {
              Write-Host "TAILSCALE_API_TOKEN 未配置，跳过 API 清理。"
              exit 0
          }

          Write-Host "::group::Tailscale API operations"
          $apiBase = "https://api.tailscale.com/api/v2"
          $headers = @{ "Authorization" = "Bearer $env:TAILSCALE_API_TOKEN" }

          try {
              $statusOutput = & $env:TS_BIN status --json 2>$null
              if ($LASTEXITCODE -ne 0) { throw "tailscale status failed (exit $LASTEXITCODE)" }
              $nodeId = ($statusOutput | ConvertFrom-Json -ErrorAction Stop).Self.ID
              if (-not $nodeId) { throw "Could not read the current Tailscale node ID." }

              $allDevices = Invoke-RestMethod -Uri "$apiBase/tailnet/-/devices" `
                  -Method Get -Headers $headers -ErrorAction Stop
              $currentApi = $allDevices.devices |
                  Where-Object { $_.nodeId -eq $nodeId } |
                  Select-Object -First 1
              if (-not $currentApi -or -not $currentApi.id) {
                  throw "Could not map the current node to an API device; refusing stale-device cleanup."
              }

              $allDevices.devices |
                  Where-Object { $_.hostname -eq 'devtop' -and $_.id -ne $currentApi.id } |
                  ForEach-Object {
                      $oldDevice = $_
                      Write-Host "  Cleaning old device: $($oldDevice.name) (ID: $($oldDevice.id))"
                      try {
                          Invoke-RestMethod -Uri "$apiBase/device/$($oldDevice.id)/authorized" `
                              -Method Post -Headers $headers `
                              -Body (@{ authorized = $false } | ConvertTo-Json) `
                              -ContentType "application/json" -ErrorAction Stop
                      } catch {
                          Write-Warning "  Could not deauthorize '$($oldDevice.name)': $($_.Exception.Message)"
                      }
                      try {
                          Invoke-RestMethod -Uri "$apiBase/device/$($oldDevice.id)" `
                              -Method Delete -Headers $headers -ErrorAction Stop
                      } catch {
                          Write-Warning "  Could not delete '$($oldDevice.name)': $($_.Exception.Message)"
                      }
                  }

              Invoke-RestMethod -Uri "$apiBase/device/$($currentApi.id)/name" `
                  -Method Post -Headers $headers `
                  -Body (@{ name = 'devtop' } | ConvertTo-Json) `
                  -ContentType "application/json" -ErrorAction Stop
              Write-Host "  Machine name set to 'devtop'."
          } catch {
              Write-Warning "  API cleanup/rename failed (non-fatal): $($_.Exception.Message)"
          }

          Write-Host "::endgroup::Tailscale API operations done"

      - name: Configure Subnet Routes and Exit Node
        run: |
          Write-Host "::group::Advertise routes / exit node"
          $localIPs = Get-NetIPAddress -AddressFamily IPv4 -ErrorAction Stop | Where-Object {
              $_.IPAddress -ne '127.0.0.1' -and
              $_.PrefixOrigin -ne 'WellKnown' -and
              $_.AddressState -eq 'Preferred' -and
              $_.PrefixLength -ge 1 -and
              $_.PrefixLength -le 30 -and
              $_.InterfaceAlias -ne 'Tailscale'
          }

          $subnets = @()
          foreach ($ip in $localIPs) {
              $addressBytes = [System.Net.IPAddress]::Parse($ip.IPAddress).GetAddressBytes()
              $isPrivate = (
                  ($addressBytes[0] -eq 10) -or
                  ($addressBytes[0] -eq 172 -and $addressBytes[1] -ge 16 -and $addressBytes[1] -le 31) -or
                  ($addressBytes[0] -eq 192 -and $addressBytes[1] -eq 168)
              )
              if (-not $isPrivate) { continue }

              $ipBytes = $addressBytes
              [Array]::Reverse($ipBytes)
              $ipInt = [System.BitConverter]::ToUInt32($ipBytes, 0)
              $maskInt = [uint32]::MaxValue -shl (32 - $ip.PrefixLength)
              $netInt = $ipInt -band $maskInt
              $netBytes = [System.BitConverter]::GetBytes($netInt)
              [Array]::Reverse($netBytes)
              $subnets += "$([System.Net.IPAddress]::new($netBytes).IPAddressToString)/$($ip.PrefixLength)"
          }
          $subnets = @($subnets | Sort-Object -Unique)

          $setArgs = @('set', '--advertise-exit-node', '--accept-routes', '--accept-dns=false')
          if ($subnets) {
              $setArgs += "--advertise-routes=$($subnets -join ',')"
          } else {
              Write-Warning "未找到可广播的子网，跳过 advertise-routes"
          }
          & $env:TS_BIN @setArgs
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale Exit Node / route configuration failed (exit $LASTEXITCODE)"
              exit 1
          }
          Write-Host "::endgroup::"

          Write-Host "Tailscale 配置完成！IP: $env:TAILSCALE_IP"
          Write-Host "=== Tailscale 配置完成 ==="
      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP 服务已就绪 ==="
          Write-Host "RDP Address (Tailscale IP): $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: （出于安全考虑，不在日志中显示）"
          Write-Host "===================================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancel the workflow to stop"
              Start-Sleep -Seconds 300
          }
